name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for release
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/ShotScorer-latest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShotScorer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest debug build
          body: |
            Latest debug APK, built from `main` at commit ${{ github.sha }}.
            Tap the `.apk` asset below on your Android tablet to install.
          files: release/ShotScorer-latest.apk
          make_latest: true
          prerelease: false
